<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study Details | Blink Beyond</title>
  <meta name="description" content="Read detailed case study breakdown, strategy, key deliverables, and measured business results.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Caveat:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/desktop/desktop.css">
  <link rel="stylesheet" href="css/tablet/tablet.css">
  <link rel="stylesheet" href="css/mobile/mobile.css">
  <link rel="stylesheet" href="css/casestudies.css">
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    (function() {
      try {
        var seen = localStorage.getItem('bb_loader_seen') === '1' || /(?:^|; )bb_loader_seen=1/.test(document.cookie);
        if (seen) {
          document.documentElement.classList.add('bb-loader-skip');
          document.documentElement.classList.add('loader-skip');
        } else {
          document.documentElement.classList.add('is-preloading');
        }
      } catch (e) {}
      try {
        if (sessionStorage.getItem('bb_page_transition') === '1') {
          document.documentElement.classList.add('bb-entering');
          document.documentElement.style.background = '#3D3DFF';
          document.documentElement.style.backgroundColor = '#3D3DFF';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="page-transition-overlay"></div>

  <!-- MAIN CASE STUDY DETAIL CONTENT -->
  <main class="cs-page-wrapper" style="padding-top: 40px;">
    <div class="cs-container" id="csDetailContainer">
      <!-- Dynamically populated by JS -->
    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/scrolltrigger.min.js"></script>
  <script src="js/casestudies-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('csDetailContainer');
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id') || 'webdev-1';

      const allProjects = window.CASE_STUDIES_DATA || [];
      const currentIndex = allProjects.findIndex(p => p.id === projectId);
      const project = currentIndex !== -1 ? allProjects[currentIndex] : allProjects[0];

      // Prev & Next project calculation
      const prevProject = currentIndex > 0 ? allProjects[currentIndex - 1] : allProjects[allProjects.length - 1];
      const nextProject = currentIndex < allProjects.length - 1 ? allProjects[currentIndex + 1] : allProjects[0];

      // Document title
      document.title = `${project.title} | Case Study | Blink Beyond`;

      const domainName = project.liveUrl ? project.liveUrl.replace(/^https?:\/\//, '').split('/')[0] : 'demo.blinkbeyond.co.in';

      // Dynamic project helpers
      const painPointsList = project.painPoints || [
        'Slow legacy load speeds impacting mobile conversion rate',
        'Outdated UI layout lacking modern brand identity',
        'Complex checkout/inquiry workflow dropping leads'
      ];

      const targetGoalsList = project.targetGoals || [
        'Achieve sub-second page loads (< 1s speed global)',
        'Modernize visual UX with responsive design',
        'Maximize client lead generation and conversion ROI'
      ];

      const workflowPhases = project.workflow || [
        { phase: 'PHASE 01', title: 'RESEARCH & UX', desc: 'User Journey Mapping & Wireframes' },
        { phase: 'PHASE 02', title: 'FULL STACK DEV', desc: 'Component Architecture & APIs' },
        { phase: 'PHASE 03', title: 'SPEED & SEO', desc: 'Lighthouse 100/100 Optimization' },
        { phase: 'PHASE 04', title: 'DEPLOYMENT', desc: 'Cloud Infrastructure & SSL' }
      ];

      const testimonialData = project.testimonial || {
        quote: 'Blink Beyond delivered exceptional speed, flawless design, and real business results. The team exceeded all our expectations!',
        author: 'Client Leadership Team',
        role: project.client
      };

      let html = `
        <!-- TOP INLINE BACK BUTTON & NAVIGATION -->
        <div class="cs-detail-top-nav" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
          <a href="casestudies.html?cat=${project.category}" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 30px; color: #ffffff; font-size: 13px; font-weight: 700; text-decoration: none; text-transform: uppercase; font-family: var(--font-display, 'Barlow Condensed', sans-serif); letter-spacing: 1px; transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" onmouseover="this.style.borderColor='#3D3DFF'; this.style.background='rgba(61,61,255,0.2)'; this.style.transform='translateX(-3px)';" onmouseout="this.style.borderColor='rgba(255, 255, 255, 0.18)'; this.style.background='rgba(255, 255, 255, 0.08)'; this.style.transform='none';">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span>Back to Case Studies</span>
          </a>

          <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #00ffaa; background: rgba(0,255,170,0.1); border: 1px solid rgba(0,255,170,0.25); padding: 6px 14px; border-radius: 20px;">
            <span class="webdev-live-dot"></span>
            <span>VERIFIED CASE STUDY</span>
          </div>
        </div>

        <!-- BREADCRUMB -->
        <nav class="cs-breadcrumb">
          <a href="index.html">Home</a>
          <span>/</span>
          <a href="casestudies.html">Case Studies</a>
          <span>/</span>
          <a href="casestudies.html?cat=${project.category}">${project.categoryName}</a>
          <span>/</span>
          <span style="color: #ffffff; font-weight: 600;">${project.title}</span>
        </nav>

        <!-- HERO HEADER -->
        <header class="cs-detail-hero">
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;">
            <span class="cs-header-badge">${project.industry || project.badgeText || 'WEB DEVELOPMENT'}</span>
          </div>

          <h1 class="cs-detail-title">${project.title}</h1>
          <p class="cs-detail-tagline">${project.tagline}</p>

          <!-- KEY METRICS BAR -->
          ${project.stats && project.stats.length > 0 ? `
            <div class="cs-detail-stats-bar">
              ${project.stats.map((stat, idx) => {
                let label = 'Measured Uplift';
                let sub = 'Verified Benchmark';
                if (idx === 0) { label = 'Primary Growth Driver'; sub = 'Peak Measured Result'; }
                if (idx === 1) { label = 'Performance Benchmark'; sub = 'Target Achievement'; }
                if (idx === 2) { label = 'Business ROI Impact'; sub = 'Bottom-line Value'; }

                return `
                  <div class="cs-detail-stat-card" style="border-color: rgba(61, 61, 255, 0.3); background: linear-gradient(145deg, rgba(14, 17, 32, 0.95) 0%, rgba(7, 8, 18, 0.98) 100%); position: relative; overflow: hidden; padding: 22px 24px; border-radius: 16px;">
                    <div style="position: absolute; top: -20px; right: -20px; width: 90px; height: 90px; background: radial-gradient(circle, rgba(0, 255, 170, 0.18) 0%, transparent 70%);"></div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                      <span style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #00d2ff;">${label}</span>
                      <span style="font-size: 11px; color: #00ffaa; font-weight: bold;">▲ UP</span>
                    </div>
                    <div class="cs-stat-number" style="color: #00ffaa; font-size: clamp(28px, 3.8vw, 38px); font-weight: 800; line-height: 1.1; margin-bottom: 6px;">${stat}</div>
                    <div class="cs-stat-label" style="font-size: 11.5px; color: rgba(255, 255, 255, 0.55); text-transform: uppercase; letter-spacing: 0.8px;">${sub}</div>
                    <div style="width: 100%; height: 2px; background: linear-gradient(90deg, #00ffaa, #00d2ff, transparent); margin-top: 14px; border-radius: 2px;"></div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}

          <!-- LIVE DEPLOYED PROJECT BUTTON BAR -->
          <div class="cs-live-btn-wrap" style="display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 36px;">
            <a href="${project.liveUrl}" target="_blank" rel="noopener noreferrer" class="cs-live-btn">
              <span>EXPLORE LIVE SITE DEMO</span>
              <span class="btn-icon">↗</span>
            </a>
            <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255, 255, 255, 0.7); background: rgba(255, 255, 255, 0.05); padding: 10px 18px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.12);">
              <span class="webdev-live-dot"></span>
              <span>Production URL: <strong style="color: #fff;">${domainName}</strong></span>
            </div>
          </div>
        </header>

        <!-- SHOWCASE INTERACTIVE BROWSER FRAME WITH TABS -->
        <div class="cs-showcase-frame">
          <div class="cs-browser-header">
            <div class="cs-browser-dots">
              <span class="cs-browser-dot red"></span>
              <span class="cs-browser-dot yellow"></span>
              <span class="cs-browser-dot green"></span>
            </div>
            <span class="cs-browser-url">🔒 ${project.liveUrl}</span>
            <div style="margin-left: auto; display: flex; gap: 8px;">
              <button id="tabBtnOverview" onclick="switchShowcaseTab('overview')" style="background: rgba(61,61,255,0.3); border: 1px solid rgba(61,61,255,0.5); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 12px; cursor: pointer;">Overview</button>
              <button id="tabBtnIframe" onclick="switchShowcaseTab('iframe')" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 12px; cursor: pointer;">Live Interactive Frame</button>
            </div>
          </div>

          <!-- TAB CONTENT 1: OVERVIEW WITH DEMO IMAGE -->
          <div id="tabContentOverview" class="cs-showcase-image-box" style="position: relative; overflow: hidden; border-radius: 0 0 14px 14px; background: #05070e;">
            ${project.heroImage ? `
              <div style="position: relative; width: 100%; max-height: 520px; overflow: hidden; background: #000;">
                <img src="${project.heroImage}" alt="${project.title} Interface Demo" style="width: 100%; height: 100%; max-height: 520px; object-fit: cover; object-position: top center; display: block; opacity: 0.95;">
                <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(5,7,14,0.7) 80%, rgba(5,7,14,0.98) 100%);"></div>
                <div style="position: absolute; bottom: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: gap; gap: 16px;">
                  <div>
                    <span style="font-family: var(--font-display, 'Barlow Condensed'); font-size: 11px; letter-spacing: 2px; color: #00ffaa; font-weight: 800; text-transform: uppercase;">✦ LIVE DEMO INTERFACE</span>
                    <h3 style="font-family: var(--font-display, 'Barlow Condensed'); font-size: clamp(20px, 3vw, 32px); font-weight: 800; color: #ffffff; text-transform: uppercase; margin: 4px 0 0 0;">${project.title}</h3>
                  </div>
                  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <a href="${project.liveUrl}" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 30px; background: #3D3DFF; color: #fff; font-size: 12px; font-weight: 800; text-decoration: none; font-family: var(--font-display, 'Barlow Condensed'); letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 0 20px rgba(61,61,255,0.5);">
                      <span>Launch Live Site</span>
                      <span>↗</span>
                    </a>
                  </div>
                </div>
              </div>
            ` : `
              <div style="text-align:center; max-width: 720px; margin: 0 auto; padding: 48px 24px;">
                <h2 style="font-family:var(--font-display, 'Barlow Condensed'); font-size: 32px; font-weight:800; color:#ffffff; text-transform:uppercase; margin-bottom:12px;">${project.title}</h2>
                <p style="font-size:15px; color:rgba(255,255,255,0.8);">${project.tagline}</p>
              </div>
            `}
          </div>

          <!-- TAB CONTENT 2: IFRAME PREVIEW -->
          <div id="tabContentIframe" style="display: none; width: 100%; height: 500px; background: #000; position: relative;">
            <iframe id="liveCaseStudyIframe" src="${project.liveUrl}" style="width: 100%; height: 100%; border: none;" title="${project.title} Preview"></iframe>
          </div>
        </div>

        <!-- PREVIOUS & NEXT PROJECT NAVIGATION CARDS -->
        <div style="margin-top: 60px; padding-top: 36px; border-top: 1px solid rgba(255, 255, 255, 0.12);">
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #00d2ff; margin-bottom: 18px; text-align: center;">EXPLORE MORE CASE STUDIES</div>
          <div class="cs-prev-next-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            <!-- PREVIOUS PROJECT -->
            <a href="casestudy-detail.html?id=${prevProject.id}" style="text-decoration: none; background: rgba(14, 17, 32, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.25s ease;" onmouseover="this.style.borderColor='#3D3DFF'; this.style.transform='translateY(-4px)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.1)'; this.style.transform='none'">
              <div>
                <span style="font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px;">← PREVIOUS CASE STUDY</span>
                <h4 style="font-family: var(--font-display, 'Barlow Condensed'); font-size: 20px; font-weight: 800; color: #fff; text-transform: uppercase; margin: 8px 0 4px 0;">${prevProject.title}</h4>
                <p style="font-size: 12.5px; color: rgba(255,255,255,0.6);">${prevProject.client} • ${prevProject.industry}</p>
              </div>
              <span style="font-size: 11px; font-weight: 800; color: #00d2ff; margin-top: 14px; display: inline-flex; align-items: center; gap: 4px;">READ STORY →</span>
            </a>

            <!-- NEXT PROJECT -->
            <a href="casestudy-detail.html?id=${nextProject.id}" style="text-decoration: none; background: rgba(14, 17, 32, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.25s ease;" onmouseover="this.style.borderColor='#3D3DFF'; this.style.transform='translateY(-4px)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.1)'; this.style.transform='none'">
              <div>
                <span style="font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px;">NEXT CASE STUDY →</span>
                <h4 style="font-family: var(--font-display, 'Barlow Condensed'); font-size: 20px; font-weight: 800; color: #fff; text-transform: uppercase; margin: 8px 0 4px 0;">${nextProject.title}</h4>
                <p style="font-size: 12.5px; color: rgba(255,255,255,0.6);">${nextProject.client} • ${nextProject.industry}</p>
              </div>
              <span style="font-size: 11px; font-weight: 800; color: #00ffaa; margin-top: 14px; display: inline-flex; align-items: center; gap: 4px;">READ STORY →</span>
            </a>
          </div>
        </div>

        <!-- BOTTOM NAVIGATION CTA -->
        <div class="cs-bottom-nav-ctas" style="display:flex; align-items:center; justify-content:space-between; padding-top:30px; border-top:1px solid rgba(255,255,255,0.1); margin-top:40px; flex-wrap: wrap; gap: 16px;">
          <a href="casestudies.html?cat=${project.category}" class="service-case-study-btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-size: 12px; font-weight: 800; font-family: var(--font-display, 'Barlow Condensed'); letter-spacing: 1px; text-transform: uppercase;">
            <span>← ALL ${project.categoryName.toUpperCase()} CASE STUDIES</span>
          </a>
          <a href="contact.html" class="service-case-study-btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 30px; background:#3D3DFF; border: 1px solid #3D3DFF; color: #fff; font-size: 12px; font-weight: 800; font-family: var(--font-display, 'Barlow Condensed'); letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 0 20px rgba(61, 61, 255, 0.4);">
            <span>START A SIMILAR PROJECT</span>
            <span>→</span>
          </a>
        </div>
      `;

      container.innerHTML = html;
    });

    // Helper to switch showcase frame tabs
    function switchShowcaseTab(tabName) {
      const overviewTab = document.getElementById('tabContentOverview');
      const iframeTab = document.getElementById('tabContentIframe');
      const btnOverview = document.getElementById('tabBtnOverview');
      const btnIframe = document.getElementById('tabBtnIframe');

      if (!overviewTab || !iframeTab) return;

      if (tabName === 'iframe') {
        overviewTab.style.display = 'none';
        iframeTab.style.display = 'block';
        btnOverview.style.background = 'rgba(255,255,255,0.06)';
        btnOverview.style.borderColor = 'rgba(255,255,255,0.12)';
        btnOverview.style.color = 'rgba(255,255,255,0.7)';

        btnIframe.style.background = 'rgba(61,61,255,0.3)';
        btnIframe.style.borderColor = 'rgba(61,61,255,0.5)';
        btnIframe.style.color = '#fff';
      } else {
        iframeTab.style.display = 'none';
        overviewTab.style.display = 'flex';
        btnIframe.style.background = 'rgba(255,255,255,0.06)';
        btnIframe.style.borderColor = 'rgba(255,255,255,0.12)';
        btnIframe.style.color = 'rgba(255,255,255,0.7)';

        btnOverview.style.background = 'rgba(61,61,255,0.3)';
        btnOverview.style.borderColor = 'rgba(61,61,255,0.5)';
        btnOverview.style.color = '#fff';
      }
    }
  </script>
  <!-- ═══════════════ FLOATING ACTION BUTTONS ═══════════════ -->
  <div class="fab-container">
    <div class="fab-options">
      <!-- Instagram Option -->
      <a href="https://instagram.com/blinkbeyond" target="_blank" rel="noopener" class="fab-option instagram-btn" aria-label="Follow on Instagram">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
        </svg>
      </a>
      <!-- WhatsApp Option -->
      <a href="https://wa.me/919545556009" target="_blank" rel="noopener" class="fab-option whatsapp-btn" aria-label="Chat on WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.888-.788-1.489-1.761-1.663-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
        </svg>
      </a>
    </div>
    <!-- Main Toggle Button -->
    <button class="fab-toggle" aria-label="Open Actions">
      <svg class="icon-chat" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8V4H8"/>
        <rect width="16" height="12" x="4" y="8" rx="2"/>
        <path d="M2 14h2"/>
        <path d="M20 14h2"/>
        <path d="M15 13v2"/>
        <path d="M9 13v2"/>
      </svg>
